# electron-builder 打包配置
# 产物：release/pomodoro-widget-setup-<version>.exe（Windows NSIS x64）
# 执行：npm run release:win（构建 + 打包 + 校验 latest.yml）

appId: com.gao.pomodoro-widget
productName: 番茄钟挂件
copyright: Copyright © 2026
directories:
  output: release
  buildResources: assets
files:
  - out/**/*
  - package.json
asar: true
# 无原生依赖（纯 JS react），跳过 native rebuild
npmRebuild: false
# 自动更新源：打包时写入 resources/app-update.yml，默认走 GitHub Releases。
# 发布时把 latest.yml、安装包、blockmap 上传到对应 tag 的 Release；
# 本地验证仍可用 UPDATE_URL 覆盖为 http://127.0.0.1:8787。
publish:
  provider: github
  owner: agkp4ever-creator
  repo: kp-dsh
win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/icons/app.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 番茄钟挂件
  # ASCII 文件名：避免中文路径在更新源 URL 编码/重定向时出现兼容问题
  artifactName: pomodoro-widget-setup-${version}.exe
  uninstallDisplayName: 番茄钟挂件
